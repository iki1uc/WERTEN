<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>VECTOR‑WERTEN · IX → XI → X4 · Lockdown‑Core</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:40px; }
h1 { color:#0ff; }
pre { background:#111; padding:20px; border-left:4px solid #0ff; white-space:pre-wrap; }
#core {
    width: 360px;
    height: 360px;
    margin: 40px auto;
    border: 3px solid #0ff;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color:#ff0;
    text-shadow:0 0 12px #ff0;
}
</style>
</head>

<body>

<h1>VECTOR‑WERTEN · Lockdown‑Core</h1>

<div id="core">X4</div>

<pre id="out">Lade VECTOR‑WERTEN…</pre>

<script>
// ------------------------------------------------------
// QI / IQQ — Basiswerte
// ------------------------------------------------------
const QI  = 1.618;     // Goldener Impuls
const IQQ = 3.141 / 2; // Stabilitätskern

// ------------------------------------------------------
// Lockdown‑Layer
// ------------------------------------------------------
let IX = 0;   // Eingangswert
let XI = 0;   // Zwischenwert
let X4 = 0;   // Endwert (versiegelt)

// ------------------------------------------------------
// Score / Wette / Slide
// ------------------------------------------------------
let score = 0;
let wette = 0;
let slide = 0;

// ------------------------------------------------------
// Echo / Hall
// ------------------------------------------------------
let echo = [];
let hall = [];

// ------------------------------------------------------
// VECTOR‑WERTEN‑ENGINE
// ------------------------------------------------------
let frame = 0;

function ENGINE(){

    frame++;

    // Eingangswert (IX)
    IX = (Math.sin(frame * 0.05) + 1) * QI;

    // Zwischenwert (XI)
    XI = (IX * IQQ) % 9;

    // Endwert (X4)
    X4 = Math.floor((XI * QI) % 12);

    // Slide
    slide = (slide + 7) % 100;

    // Wette
    wette = (X4 % 5) + 1;

    // Score
    score += wette + Math.floor(slide / 10);

    // Echo / Hall
    echo.push(X4);
    if (echo.length > 6) echo.shift();

    hall.push(XI.toFixed(2));
    if (hall.length > 6) hall.shift();

    // Core‑Animation
    const core = document.getElementById("core");
    core.textContent = "X4";
    core.style.transform = `rotate(${frame * 4}deg) scale(${1 + slide/100})`;
    core.style.color = X4 % 2 === 0 ? "#0f0" : "#ff0";

    // Ausgabe
    document.getElementById("out").textContent = `
VECTOR‑WERTEN · Lockdown‑Core
FRAME: ${frame}

IX  (Eingang):      ${IX.toFixed(3)}
XI  (Zwischen):     ${XI.toFixed(3)}
X4  (Endwert):      ${X4}

SLIDE:              ${slide}%
WETTE:              +${wette}
SCORE:              ${score}

ECHO (X4‑History):  ${echo.join("  ")}
HALL (XI‑History):  ${hall.join("  ")}

QI:                 ${QI}
IQQ:                ${IQQ.toFixed(3)}

STATUS: ACTIVE · LOCKDOWN‑CORE
`;
    requestAnimationFrame(ENGINE);
}

ENGINE();
</script>

</body>
</html>
